  <style>:root {
  --bg: #0e1320; --panel: #161d2e; --line: #26304a; --text: #e6ebf5; --muted: #8a96b2;
  --hue: 220; --accent: hsl(var(--hue) 80% 66%); --accent-soft: hsl(var(--hue) 60% 40% / .35);
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { min-height: 100vh; padding: var(--safe-t) 0 calc(var(--safe-b) + 16px);
  background: radial-gradient(120% 60% at 50% 0%, hsl(var(--hue) 50% 20% / .55), transparent 70%), var(--bg);
  transition: background .6s; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }

.top { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: .02em; font-size: 18px; }
.icon-btn { background: none; border: 1px solid var(--line); border-radius: 10px; width: 40px; height: 40px; font-size: 18px; }

.scapes { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 10px; scrollbar-width: none; }
.scapes::-webkit-scrollbar { display: none; }
.scape { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 4px;
  min-width: 78px; padding: 10px 8px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--panel); color: var(--muted); font-size: 12px; }
.scape b { font-size: 22px; font-weight: 400; color: hsl(var(--h) 70% 70%); }
.scape[aria-current="true"] { color: var(--text); border-color: hsl(var(--h) 70% 60%);
  background: linear-gradient(180deg, hsl(var(--h) 50% 30% / .45), var(--panel)); }

main { max-width: 760px; margin: 0 auto; padding: 0 16px; }
.hero h1 { margin: 6px 0 2px; font-size: 26px; font-weight: 650; }
.hero p { margin: 0 0 14px; color: var(--muted); }

.mixer { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; padding: 14px 8px 10px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px; }
.ch { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
.ch .val { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ch label { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.15; height: 2.4em;
  overflow: visible; width: 100%; word-break: normal; overflow-wrap: anywhere; hyphens: manual; letter-spacing: -.02em; }
.ch.on label { color: var(--text); }

/* vertical slider */
.vs { -webkit-appearance: none; appearance: none; writing-mode: vertical-lr; direction: rtl;
  width: 30px; height: 220px; background: transparent; margin: 0; touch-action: none; }
.vs::-webkit-slider-runnable-track { width: 6px; border-radius: 3px;
  background: linear-gradient(to top, var(--accent) var(--p, 50%), var(--line) var(--p, 50%)); }
.vs::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 18px; border-radius: 6px;
  background: var(--text); border: 0; margin-left: -10px; box-shadow: 0 2px 8px #0008; }
.vs::-moz-range-track { width: 6px; border-radius: 3px; background: var(--line); }
.vs::-moz-range-progress { width: 6px; border-radius: 3px; background: var(--accent); }
.vs::-moz-range-thumb { width: 26px; height: 18px; border-radius: 6px; background: var(--text); border: 0; }

.transport { display: flex; align-items: center; gap: 18px; margin: 18px 0 10px; }
.play { width: 68px; height: 68px; border-radius: 50%; border: 0; font-size: 26px; flex: 0 0 auto;
  background: var(--accent); color: #0b0f1a; box-shadow: 0 6px 24px var(--accent-soft); }
.play.on { background: var(--text); }
.vol { flex: 1; display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; }
.vol input { width: 100%; accent-color: var(--accent); }

.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 8px 14px; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.chip.select { display: inline-flex; gap: 6px; align-items: center; }
.chip select { background: transparent; border: 0; outline: 0; }
.chip select option { background: var(--panel); }
.timer-left { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

.drawer { position: fixed; inset: 0; background: #0009; display: flex; justify-content: flex-end; z-index: 10; }
.drawer[hidden] { display: none; }
.drawer-inner { width: min(360px, 90vw); height: 100%; background: var(--panel); padding: calc(var(--safe-t) + 16px) 16px 16px;
  overflow-y: auto; border-left: 1px solid var(--line); }
.drawer h2 { margin: 0 0 12px; }
.save { display: flex; gap: 8px; margin-bottom: 12px; }
.save input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.presets { list-style: none; padding: 0; margin: 0 0 16px; }
.presets li { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.presets li button.load { flex: 1; text-align: left; background: none; border: 0; padding: 0; }
.presets li small { color: var(--muted); display: block; }
.presets li .del { background: none; border: 0; color: var(--muted); font-size: 18px; }
.hint { color: var(--muted); font-size: 13px; }

@media (max-width: 420px) {
  .mixer { gap: 0; padding: 12px 2px 8px; }
  .vs { height: 200px; width: 26px; }
  .ch label { font-size: 9.5px; }
}

.scape-sep { flex: 0 0 auto; align-self: center; writing-mode: vertical-lr; transform: rotate(180deg);
  font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 0 2px; }
.loading { margin: -8px 0 10px; color: var(--accent); font-size: 13px; }
.credits { margin: 0 0 16px; font-size: 13px; }
.credits summary { cursor: pointer; color: var(--muted); }
.credits ul { padding-left: 18px; }
.credits li { margin: 4px 0; }
.credits a { color: var(--accent); }
</style>
</head>

// Driftwave audio engine — everything is synthesized locally with the Web Audio API.
// No audio files, no network. Modulation (waves, gusts, swells) runs inside the audio
// graph so it keeps working when JS timers are throttled (screen off / background).

const LOOP_SECONDS = 12;
const EVENT_SECONDS = 24;

function rand(a, b) { return a + Math.random() * (b - a); }

// Build a seamless stereo loop: generate N+F samples, crossfade the tail into the head.
function makeLoop(ctx, seconds, fill) {
  const sr = ctx.sampleRate;
  const N = Math.floor(seconds * sr);
  const F = Math.floor(0.5 * sr);
  const buf = ctx.createBuffer(2, N, sr);
  for (let ch = 0; ch < 2; ch++) {
    const raw = new Float32Array(N + F);
    fill(raw, sr, ch);
    const out = buf.getChannelData(ch);
    for (let i = 0; i < N; i++) out[i] = raw[i];
    for (let i = 0; i < F; i++) {
      const t = i / F;
      out[i] = raw[i] * Math.sqrt(t) + raw[N + i] * Math.sqrt(1 - t);
    }
  }
  return buf;
}

const noiseFills = {
  white(d) { for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * 0.5; },
  pink(d) {
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < d.length; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759;
      b2 = 0.96900 * b2 + w * 0.1538520; b3 = 0.86650 * b3 + w * 0.3104856;
      b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
      d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
      b6 = w * 0.115926;
    }
  },
  brown(d) {
    let last = 0, dc = 0;
    for (let i = 0; i < d.length; i++) {
      last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
      d[i] = last * 3.5;
    }
    for (let i = 0; i < d.length; i++) dc += d[i];
    dc /= d.length;
    for (let i = 0; i < d.length; i++) d[i] -= dc;
  },
};

// ---- Event textures (drops, crackles, chimes, birds...) rendered once into loops ----
function scatter(d, sr, perSecond, render) {
  const n = Math.floor((d.length / sr) * perSecond);
  for (let k = 0; k < n; k++) render(d, sr, Math.floor(Math.random() * d.length));
}
function add(d, i, v) { if (i >= 0 && i < d.length) d[i] += v; }

const eventFills = {
  drops(d, sr) { // water droplets: short rising sine "plinks"
    scatter(d, sr, 14, (d, sr, at) => {
      const f0 = rand(600, 2600), amp = Math.pow(Math.random(), 2) * 0.6;
      const len = Math.floor(sr * 0.06); let ph = 0;
      for (let i = 0; i < len; i++) {
        const t = i / sr;
        ph += 2 * Math.PI * f0 * (1 + 0.8 * Math.min(t / 0.02, 1)) / sr;
        add(d, at + i, Math.sin(ph) * amp * Math.exp(-t / 0.012));
      }
    });
  },
  patter(d, sr) { // dense tiny ticks: rain on surfaces
    scatter(d, sr, 260, (d, sr, at) => {
      const amp = Math.pow(Math.random(), 3) * 0.5, len = Math.floor(sr * 0.004);
      for (let i = 0; i < len; i++) add(d, at + i, (Math.random() * 2 - 1) * amp * Math.exp(-i / (sr * 0.0008)));
    });
  },
  crackle(d, sr) { // fire crackles and occasional pops
    scatter(d, sr, 22, (d, sr, at) => {
      const big = Math.random() < 0.12;
      const amp = (big ? 0.9 : 0.35) * Math.pow(Math.random(), 1.5);
      const len = Math.floor(sr * (big ? 0.03 : 0.008)), tau = sr * (big ? 0.006 : 0.0015);
      for (let i = 0; i < len; i++) add(d, at + i, (Math.random() * 2 - 1) * amp * Math.exp(-i / tau));
      if (Math.random() < 0.3) { // tiny burst cluster
        for (let j = 0; j < 4; j++) {
          const o = at + Math.floor(rand(0.005, 0.06) * sr), a = amp * rand(0.1, 0.4);
          for (let i = 0; i < sr * 0.003; i++) add(d, o + i, (Math.random() * 2 - 1) * a * Math.exp(-i / (sr * 0.0007)));
        }
      }
    });
  },
  embers(d, sr) { // soft hiss pulses
    scatter(d, sr, 3, (d, sr, at) => {
      const len = Math.floor(sr * rand(0.3, 1.2)), amp = rand(0.05, 0.2);
      for (let i = 0; i < len; i++) add(d, at + i, (Math.random() * 2 - 1) * amp * Math.sin(Math.PI * i / len));
    });
  },
  chimes(d, sr) { // pentatonic glass chimes
    const scale = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];
    scatter(d, sr, 0.7, (d, sr, at) => {
      const f = 523.25 * Math.pow(2, scale[Math.floor(Math.random() * scale.length)] / 12);
      const amp = rand(0.08, 0.22), len = Math.floor(sr * 4);
      const parts = [[1, 1], [2.76, 0.4], [5.4, 0.2], [8.93, 0.1]];
      for (let i = 0; i < len; i++) {
        const t = i / sr; let s = 0;
        for (const [m, a] of parts) s += Math.sin(2 * Math.PI * f * m * t) * a * Math.exp(-t * (0.9 + m * 0.5));
        add(d, at + i, s * amp * Math.min(1, t * 400));
      }
    });
  },
  birds(d, sr) { // phrases of synthetic chirps
    scatter(d, sr, 0.45, (d, sr, at) => {
      const base = rand(2200, 4800), n = 2 + Math.floor(Math.random() * 6), amp = rand(0.05, 0.18);
      const dir = Math.random() < 0.5 ? 1 : -1, gap = rand(0.07, 0.16), clen = rand(0.04, 0.09);
      let off = at;
      for (let c = 0; c < n; c++) {
        const len = Math.floor(sr * clen); let ph = 0;
        for (let i = 0; i < len; i++) {
          const x = i / len;
          const f = base * (1 + dir * 0.35 * x) + 300 * Math.sin(2 * Math.PI * 30 * i / sr);
          ph += 2 * Math.PI * f / sr;
          add(d, off + i, Math.sin(ph) * amp * Math.sin(Math.PI * x));
        }
        off += Math.floor(sr * gap);
      }
    });
  },
  crickets(d, sr) { // pulsed narrow tone
    let t0 = 0;
    while (t0 < d.length) {
      const f = rand(4300, 4600), pulses = 3 + Math.floor(Math.random() * 3), amp = rand(0.04, 0.1);
      for (let p = 0; p < pulses; p++) {
        const at = t0 + Math.floor(p * 0.025 * sr), len = Math.floor(0.015 * sr);
        for (let i = 0; i < len; i++) add(d, at + i, Math.sin(2 * Math.PI * f * i / sr) * amp * Math.sin(Math.PI * i / len));
      }
      t0 += Math.floor(rand(0.35, 0.8) * sr);
    }
  },
  bubbles(d, sr) { // stream bubbles: falling-pitch blips
    scatter(d, sr, 30, (d, sr, at) => {
      const f0 = rand(300, 1400), amp = Math.pow(Math.random(), 2) * 0.35, len = Math.floor(sr * 0.04); let ph = 0;
      for (let i = 0; i < len; i++) {
        const t = i / sr; ph += 2 * Math.PI * f0 * (1 + 2.5 * t / 0.04) / sr;
        add(d, at + i, Math.sin(ph) * amp * Math.exp(-t / 0.01));
      }
    });
  },
  clock(d, sr) { // soft ticking, one tick per second
    for (let s = 0; s < d.length; s += sr) {
      const amp = (s / sr) % 2 ? 0.25 : 0.2;
      for (let i = 0; i < sr * 0.01; i++) add(d, s + i, (Math.random() * 2 - 1) * amp * Math.exp(-i / (sr * 0.0012)));
    }
  },
};

// Shaper curve mapping an LFO in [-1,1] to an envelope in [0,1] with sharpness p.
function shaperCurve(p) {
  const n = 1024, c = new Float32Array(n);
  for (let i = 0; i < n; i++) { const x = i / (n - 1); c[i] = Math.pow(x, p); }
  return c;
}

class Engine {
  constructor() {
    this.ctx = null;
    this.buffers = {};
    this.recs = new Map();
    this.channels = [];
    this.playing = false;
    this.masterLevel = 0.8;
  }

  init() {
    if (this.ctx) return;
    const ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'playback' });
    this.ctx = ctx;
    this.limiter = ctx.createDynamicsCompressor();
    this.limiter.threshold.value = -6; this.limiter.knee.value = 6;
    this.limiter.ratio.value = 12; this.limiter.attack.value = 0.005; this.limiter.release.value = 0.25;
    this.fade = ctx.createGain(); this.fade.gain.value = 0;        // play/pause + sleep timer fades
    this.master = ctx.createGain(); this.master.gain.value = this.masterLevel;
    this.master.connect(this.limiter).connect(this.fade).connect(ctx.destination);
  }

  buffer(src) {
    if (!this.buffers[src]) {
      if (noiseFills[src]) this.buffers[src] = makeLoop(this.ctx, LOOP_SECONDS, noiseFills[src]);
      else {
        const fill = eventFills[src.replace('ev:', '')];
        this.buffers[src] = makeLoop(this.ctx, EVENT_SECONDS, fill);
      }
    }
    return this.buffers[src];
  }

  lfo(rate, spread) { // returns a node producing a smooth signal in [-1,1]
    const ctx = this.ctx, sum = ctx.createGain();
    const parts = spread ? 3 : 1;
    sum.gain.value = 1 / parts;
    for (let i = 0; i < parts; i++) {
      const o = ctx.createOscillator();
      o.frequency.value = rate * (spread ? [1, 1.618, 2.414][i] * rand(0.85, 1.15) : rand(0.9, 1.1));
      o.connect(sum); o.start(ctx.currentTime + rand(0, 1)); this.nodes.push(o);
    }
    return sum;
  }

  build(scape, values) {
    this.teardown();
    const ctx = this.ctx;
    this.nodes = [];
    this.channels = scape.channels.map((c, i) => {
      const out = ctx.createGain();           // slider level
      out.gain.value = 0;
      const modGain = ctx.createGain();       // modulation envelope
      let src;
      if (c.osc) {
        src = ctx.createGain(); src.gain.value = 1 / c.osc.length;
        for (const f of c.osc) {
          const o = ctx.createOscillator(); o.type = c.wave || 'sine';
          o.frequency.value = f; o.detune.value = rand(-6, 6);
          o.connect(src); o.start(); this.nodes.push(o);
        }
      } else if (c.src.startsWith('rec:')) {
        src = ctx.createGain();               // recording is attached here once loaded (lazily)
      } else {
        src = ctx.createBufferSource(); src.buffer = this.buffer(c.src); src.loop = true;
        src.playbackRate.value = c.rate || 1;
        src.start(0, rand(0, src.buffer.duration)); this.nodes.push(src);
      }
      let node = src, fmodDone = false;
      for (const f of (c.f ? (Array.isArray(c.f[0]) ? c.f : [c.f]) : [])) {
        const bq = ctx.createBiquadFilter(); bq.type = f[0]; bq.frequency.value = f[1];
        if (f[2] != null) bq.Q.value = f[2];
        if (c.fmod && !fmodDone) {
          const l = this.lfo(c.fmod.rate, true), g = ctx.createGain();
          g.gain.value = f[1] * c.fmod.depth; l.connect(g).connect(bq.frequency); fmodDone = true;
        }
        node.connect(bq); node = bq;
      }
      node.connect(modGain);
      if (c.mod) {
        const { rate, depth, p = 1, gust } = c.mod;
        modGain.gain.value = 1 - depth;
        const l = this.lfo(rate, !!gust);
        const sh = ctx.createWaveShaper(); sh.curve = shaperCurve(p);
        // shaper input domain is [-1,1]; curve indexed over that range, so x→((x+1)/2)^p
        const g = ctx.createGain(); g.gain.value = depth;
        l.connect(sh).connect(g).connect(modGain.gain);
      }
      let tail = modGain;
      if (c.pan) { const pn = ctx.createStereoPanner(); pn.pan.value = c.pan; tail.connect(pn); tail = pn; }
      tail.connect(out); out.connect(this.master);
      return { spec: c, out, input: src, rec: c.src && c.src.startsWith('rec:') ? c.src.slice(4) : null };
    });
    // Free decoded recordings that the new soundscape doesn't use (keeps phone memory low).
    const keep = new Set(this.channels.map((ch) => ch.rec).filter(Boolean));
    for (const k of this.recs.keys()) if (!keep.has(k)) this.recs.delete(k);
    this.channels.forEach((ch, i) => this.setLevel(i, values[i], true));
  }

  // Recorded loops are decoded at 32 kHz (plenty for ambience, ~1/3 less memory) and only when a slider is up.
  loadRec(name) {
    if (!this.recs.has(name)) {
      const p = fetch(`sounds/${name}.ogg`).then((r) => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
        .then((ab) => new OfflineAudioContext(2, 1, 32000).decodeAudioData(ab.slice(0))
          .catch(() => this.ctx.decodeAudioData(ab)));
      p.catch((e) => { console.warn('sound failed', name, e); this.recs.delete(name); });
      this.recs.set(name, p);
    }
    return this.recs.get(name);
  }

  ensureRec(ch, v) {
    if (!ch.rec || ch.started || v < 0.01) return;
    ch.started = true;
    this.loadRec(ch.rec).then((buf) => {
      if (!this.channels.includes(ch)) return;   // soundscape changed while loading
      const s = this.ctx.createBufferSource(); s.buffer = buf; s.loop = true;
      s.playbackRate.value = ch.spec.rate || 1;
      s.connect(ch.input); s.start(0, rand(0, buf.duration)); this.nodes.push(s);
      this.onLoading?.(-1);
    }, () => { ch.started = false; this.onLoading?.(-1); });
    this.onLoading?.(1);
  }

  teardown() {
    for (const n of this.nodes || []) { try { n.stop(); } catch (e) {} try { n.disconnect(); } catch (e) {} }
    for (const ch of this.channels) ch.out.disconnect();
    this.nodes = []; this.channels = [];
  }

  setLevel(i, v, instant) {
    const ch = this.channels[i]; if (!ch) return;
    this.ensureRec(ch, v);
    const target = (ch.spec.gain || 1) * v * v;
    const p = ch.out.gain, t = this.ctx.currentTime;
    p.cancelScheduledValues(t);
    if (instant) p.setValueAtTime(target, t); else p.setTargetAtTime(target, t, 0.08);
  }
  // Slow glide used by "Animate"
  glideLevel(i, v, seconds) {
    const ch = this.channels[i]; if (!ch) return;
    this.ensureRec(ch, v);
    const p = ch.out.gain, t = this.ctx.currentTime;
    p.cancelScheduledValues(t); p.setTargetAtTime((ch.spec.gain || 1) * v * v, t, seconds / 3);
  }

  setMaster(v) {
    this.masterLevel = v;
    if (this.master) this.master.gain.setTargetAtTime(v * v, this.ctx.currentTime, 0.05);
  }

  async play() {
    this.init(); await this.ctx.resume();
    const g = this.fade.gain, t = this.ctx.currentTime;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(1, t + 1.5);
    this.playing = true;
  }

  pause() {
    if (!this.ctx) return;
    const g = this.fade.gain, t = this.ctx.currentTime;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(0, t + 0.6);
    this.playing = false;
    clearTimeout(this._suspendT);
    this._suspendT = setTimeout(() => { if (!this.playing) this.ctx.suspend(); }, 800);
  }

  // Sleep timer scheduled inside the audio clock, so it fires even if the page is throttled.
  scheduleFadeOut(minutes) {
    if (!this.ctx) return;
    const g = this.fade.gain, t = this.ctx.currentTime, end = t + minutes * 60;
    const fadeLen = Math.min(90, minutes * 60 * 0.2);
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t);
    g.setValueAtTime(1, end - fadeLen); g.linearRampToValueAtTime(0, end);
  }
  cancelFadeOut() {
    if (!this.ctx || !this.playing) return;
    const g = this.fade.gain, t = this.ctx.currentTime;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(1, t + 1);
  }
}


const $ = (s) => document.querySelector(s);
const engine = new Engine(); window.__eng = engine;
const KEY = 'driftwave.v1';

const state = Object.assign(
  { scape: SCAPES[0].id, mixes: {}, presets: [], master: 0.8, timer: 0 },
  JSON.parse(localStorage.getItem(KEY) || '{}'),
);
const save = () => localStorage.setItem(KEY, JSON.stringify(state));

let scape, values, sliders = [], animTimer = null, timerEnd = 0, timerTick = null;
const defaults = (s) => s.channels.map((c) => c.def ?? 0.5);

// Recorded soundscapes need the sounds/ folder, which the single-file (file://) version doesn't have.
const CAN_RECORDED = location.protocol !== 'file:';
const AVAILABLE = SCAPES.filter((s) => CAN_RECORDED || !s.recorded);

// Apply calibrated gain so each layer is comparable in loudness at the same slider position.
for (const s of SCAPES) s.channels.forEach((c, i) => { c.gain = (s.trim ?? 1) * (c.level ?? 1) * (CALIB[`${s.id}:${i}`] ?? 1); });

// ---- UI building ----
function renderScapes() {
  const nav = $('#scapes'); nav.innerHTML = '';
  AVAILABLE.forEach((s, k) => {
    if (s.recorded && !AVAILABLE[k - 1]?.recorded) {
      const sep = document.createElement('span'); sep.className = 'scape-sep'; sep.textContent = 'Recorded'; nav.appendChild(sep);
    }
    const b = document.createElement('button');
    b.className = 'scape'; b.style.setProperty('--h', s.hue);
    b.innerHTML = `<b>${s.icon}</b>${s.name}`;
    b.setAttribute('aria-current', s.id === state.scape);
    b.onclick = () => selectScape(s.id);
    nav.appendChild(b);
  });
}

function renderMixer() {
  const m = $('#mixer'); m.innerHTML = ''; sliders = [];
  scape.channels.forEach((c, i) => {
    const wrap = document.createElement('div'); wrap.className = 'ch';
    const val = document.createElement('span'); val.className = 'val';
    const r = document.createElement('input');
    Object.assign(r, { type: 'range', min: 0, max: 1, step: 0.01, className: 'vs', id: `ch${i}` });
    r.setAttribute('aria-label', c.name);
    const lab = document.createElement('label'); lab.htmlFor = r.id; lab.textContent = hyphenate(c.name);
    r.oninput = () => { values[i] = +r.value; paint(i); engine.channels.length && engine.setLevel(i, values[i]); persistMix(); };
    wrap.append(val, r, lab); m.appendChild(wrap);
    sliders.push({ r, val, wrap });
  });
  sliders.forEach((_, i) => paint(i));
}

// Soft hyphens so long words wrap neatly in the narrow slider columns.
const SPLITS = { Songbirds: 'Song|birds', Woodpecker: 'Wood|pecker', Waterfall: 'Water|fall', Campfire: 'Camp|fire',
  Downpour: 'Down|pour', Underwater: 'Under|water', Restaurant: 'Restau|rant', Typewriter: 'Type|writer',
  Fireplace: 'Fire|place', Submarine: 'Sub|marine', Seagulls: 'Sea|gulls', Sailboat: 'Sail|boat', Airplane: 'Air|plane',
  Highway: 'High|way', Crickets: 'Crick|ets', Crackle: 'Crack|le', Thunder: 'Thun|der', Distant: 'Dis|tant',
  Morning: 'Morn|ing', Village: 'Vil|lage', Tempest: 'Tem|pest', Harbour: 'Har|bour', chatter: 'chat|ter',
  Library: 'Li|brary', outside: 'out|side', purring: 'purr|ing', Ceiling: 'Ceil|ing', Singing: 'Sing|ing',
  Cascade: 'Cas|cade', Trickle: 'Trick|le', Airflow: 'Air|flow', Turbine: 'Tur|bine', Shimmer: 'Shim|mer', Pebbles: 'Peb|bles', Canopy: 'Can|opy' };
const hyphenate = (n) => n.split(' ').map((w) => (SPLITS[w] || w).replace('|', '\u00ad')).join(' ');

function paint(i) {
  const s = sliders[i], v = values[i];
  s.r.value = v; s.r.style.setProperty('--p', `${v * 100}%`);
  s.val.textContent = Math.round(v * 100);
  s.wrap.classList.toggle('on', v > 0.01);
}

let persistT;
function persistMix() { clearTimeout(persistT); persistT = setTimeout(() => { state.mixes[scape.id] = values.slice(); save(); }, 250); }

function selectScape(id, vals) {
  scape = AVAILABLE.find((s) => s.id === id) || AVAILABLE[0];
  state.scape = scape.id;
  values = (vals || state.mixes[scape.id] || defaults(scape)).slice();
  document.documentElement.style.setProperty('--hue', scape.hue);
  $('#scapeName').textContent = scape.name;
  $('#scapeDesc').textContent = scape.desc;
  renderScapes(); renderMixer();
  if (engine.ctx) engine.build(scape, values);
  state.mixes[scape.id] = values.slice(); save();
  updateMediaSession();
  if (engine.playing) nativeStart();
}

// ---- Native background playback (Android app only; no-op in the browser) ----
const isNative = !!window.Capacitor?.isNativePlatform?.();
const Native = isNative ? window.Capacitor.registerPlugin('Playback') : null;
if (Native) Native.addListener('stop', () => { if (engine.playing) togglePlay(); });
const nativeStart = () => Native?.start({ title: `Driftwave · ${scape.name}` }).catch(() => {});
const nativeStop = () => Native?.stop().catch(() => {});

// ---- Transport ----
async function togglePlay() {
  if (engine.playing) { engine.pause(); setPlayUI(false); stopTimer(); nativeStop(); return; }
  const first = !engine.ctx;
  engine.init();
  if (first || !engine.channels.length) engine.build(scape, values);
  engine.setMaster(state.master);
  await engine.play(); setPlayUI(true); nativeStart();
  if (state.timer) startTimer(state.timer);
}
function setPlayUI(on) {
  const b = $('#playBtn'); b.textContent = on ? '❚❚' : '▶'; b.classList.toggle('on', on);
  b.setAttribute('aria-label', on ? 'Pause' : 'Play');
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = on ? 'playing' : 'paused';
}

// ---- Sleep timer ----
function startTimer(min) {
  stopTimer();
  if (!min || !engine.playing) return;
  engine.scheduleFadeOut(min);
  timerEnd = Date.now() + min * 60000;
  timerTick = setInterval(() => {
    const left = timerEnd - Date.now();
    if (left <= 0) { stopTimer(); engine.pause(); setPlayUI(false); nativeStop(); return; }
    const m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60;
    $('#timerLeft').textContent = `${m}:${String(s).padStart(2, '0')} left`;
  }, 1000);
}
function stopTimer() { clearInterval(timerTick); timerTick = null; $('#timerLeft').textContent = ''; }

// ---- Animate: sliders drift gently around where you set them ----
function toggleAnimate() {
  const b = $('#animBtn');
  if (animTimer) { clearInterval(animTimer); animTimer = null; b.setAttribute('aria-pressed', 'false'); return; }
  b.setAttribute('aria-pressed', 'true');
  const base = values.slice();
  animTimer = setInterval(() => {
    values = values.map((v, i) => {
      if (base[i] < 0.02) return v;
      const nv = Math.min(1, Math.max(0, v + (Math.random() - 0.5) * 0.12));
      return Math.min(base[i] + 0.25, Math.max(base[i] - 0.25, nv));
    });
    values.forEach((v, i) => { paint(i); engine.channels.length && engine.glideLevel(i, v, 4); });
  }, 4000);
}

function shuffle() {
  values = values.map(() => Math.round(Math.pow(Math.random(), 1.3) * 100) / 100);
  values.forEach((v, i) => { paint(i); engine.channels.length && engine.setLevel(i, v); });
  persistMix();
}
function reset() {
  values = defaults(scape);
  values.forEach((v, i) => { paint(i); engine.channels.length && engine.setLevel(i, v); });
  persistMix();
}

// ---- Presets ----
function renderPresets() {
  const ul = $('#presetList'); ul.innerHTML = '';
  if (!state.presets.length) { ul.innerHTML = '<li><small>No saved mixes yet.</small></li>'; return; }
  state.presets.forEach((p, idx) => {
    const li = document.createElement('li');
    const sc = AVAILABLE.find((s) => s.id === p.scape);
    if (!sc) return;
    const load = document.createElement('button'); load.className = 'load';
    load.innerHTML = `${escapeHtml(p.name)}<small>${sc ? sc.name : p.scape}</small>`;
    load.onclick = () => { selectScape(p.scape, p.values); closeDrawer(); };
    const del = document.createElement('button'); del.className = 'del'; del.textContent = '×';
    del.setAttribute('aria-label', `Delete ${p.name}`);
    del.onclick = () => { state.presets.splice(idx, 1); save(); renderPresets(); };
    li.append(load, del); ul.appendChild(li);
  });
}
const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let pending = 0;
engine.onLoading = (d) => { pending = Math.max(0, pending + d); $('#loading').hidden = pending === 0; };

function renderCredits() {
  $('#creditList').innerHTML = CREDITS.map((c) =>
    `<li><a href="${c.url}" target="_blank" rel="noopener">${escapeHtml(c.what)}</a> by ${escapeHtml(c.who)} (${c.license})</li>`).join('');
  $('#creditNote').textContent = CREDITS_NOTE;
}
function openDrawer() { renderCredits(); renderPresets(); $('#drawer').hidden = false; }
function closeDrawer() { $('#drawer').hidden = true; }

// ---- Media session (lock-screen / notification controls where supported) ----
function updateMediaSession() {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({ title: scape.name, artist: 'Driftwave',
    artwork: [{ src: 'icons/icon-512.png', sizes: '512x512', type: 'image/png' }] });
  navigator.mediaSession.setActionHandler('play', () => { if (!engine.playing) togglePlay(); });
  navigator.mediaSession.setActionHandler('pause', () => { if (engine.playing) togglePlay(); });
}

// ---- Wire up ----
$('#playBtn').onclick = togglePlay;
$('#master').value = state.master;
$('#master').oninput = (e) => { state.master = +e.target.value; engine.setMaster(state.master); save(); };
$('#animBtn').onclick = toggleAnimate;
$('#randBtn').onclick = shuffle;
$('#resetBtn').onclick = reset;
$('#timer').value = String(state.timer);
$('#timer').onchange = (e) => {
  state.timer = +e.target.value; save();
  if (state.timer) startTimer(state.timer); else { stopTimer(); engine.cancelFadeOut(); }
};
$('#menuBtn').onclick = openDrawer;
$('#closeDrawer').onclick = closeDrawer;
$('#drawer').onclick = (e) => { if (e.target.id === 'drawer') closeDrawer(); };
$('#saveForm').onsubmit = (e) => {
  e.preventDefault();
  const name = $('#presetName').value.trim(); if (!name) return;
  state.presets.unshift({ name, scape: scape.id, values: values.slice() });
  save(); $('#presetName').value = ''; renderPresets();
};
document.addEventListener('keydown', (e) => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); togglePlay(); } });

selectScape(state.scape);

// Offline support (service workers don't run from file:// or inside the Android wrapper's local scheme — not needed there).
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !isNative) {
  navigator.serviceWorker.register('sw.js');
}

</script>
</body>
